<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mequi Experience</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="pagina-login">

        <section class="login-container" aria-labelledby="titulo-login">

            <img
                src="https://pngimg.com/uploads/mcdonalds/mcdonalds_PNG17.png"
                class="logo-login"
                alt="Logo do Mequi"
            >

            <h1 id="titulo-login">Mequi Experience</h1>
            <h2>Área dos funcionários</h2>

            {% if erro %}
                <p class="erro-login" role="alert">{{ erro }}</p>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <label for="usuario">Usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    autocomplete="username"
                    placeholder="Digite seu usuário"
                    autofocus
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">Entrar</button>
            </form>

            <a href="{{ url_for('inicio') }}">Voltar ao cardápio</a>

        </section>

    </main>

</body>
</html>
